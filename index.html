<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Charts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Solway:wght@400;700&display=swap" rel="stylesheet">


<style>
body {
  margin: 0;
  font-family: "Rethink Sans", sans-serif;
  font-weight:400;
  font-size: 12px;
}

::-webkit-scrollbar { width: 5px; height: 5px; background: rgb(0, 0, 0); border:2px solid white;}
::-webkit-scrollbar-thumb { background: #244237; width:3px; border:1px solid white; height: auto; }

.image-container {
  position: relative;
  max-width: 1200px;
  margin: auto;
}

.base-image {
  width: 100%;
  display: block;
}

#markers-container {
  position: absolute;
  inset: 0;
}

/* Sidebar */
#sidebar {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 20;
  font-family: "Solway", sans-serif;
  text-transform: uppercase;
  height:150px; overflow:auto;
  padding-right:5px;
}

#sidebar label {
  margin-bottom: 5px;
  display:flex;
   align-items: center;
   gap:5px;
   accent-color:#244237;
}


/* Marker wrapper */
.marker-wrapper {
  position: absolute;
  transform: translate(-50%, -50%);
  transition:all 0.4s ease;
}

.marker {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.4s ease;
}

/* Marker fill */
.marker-fic { background: #EC9165; }
.marker-nonfic { background: #6c9d66; }
.marker-other { background: #4c8493; }


/* Labels */
.marker-label {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  font-weight: 600;
  opacity: 0;
  visibility: hidden;
  background: white;
  pointer-events: none;
  transition: all 0.3s ease;
  text-transform:uppercase;

}

.marker-wrapper:hover .marker-label,
.marker-wrapper:focus-within .marker-label {
  opacity: 1;
  visibility: visible;
}

.marker-wrapper:hover .marker {
  background: #b61219;
}

.marker-wrapper:hover,
.marker-wrapper:focus-within {
  z-index: 10;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
  
  <label><input type="checkbox" id="solo-mode"> Solo year</label><hr>
  <label><input type="checkbox" data-year="2025"> 2025</label>
  <label><input type="checkbox" data-year="2026" checked> 2026</label>
  <label><input type="checkbox" data-year="2027"> 2027</label>
</div>

<!-- Image -->
<div class="image-container">
  <img src="./BOOKCHART.jpg" class="base-image" alt="Map">
  <div id="markers-container"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="./markers/markers-2026.js"></script>
<script src="./markers/markers.js"></script>

<script>
function renderMarkers() {
  const container = $("#markers-container");
  container.empty();

  Object.entries(markersByYear).forEach(([year, markers]) => {
    markers.forEach(marker => {
      const $wrapper = $(`
        <div class="marker-wrapper"
             data-year="${year}"
             style="top:${marker.position.top}; left:${marker.position.left}; opacity:1; pointer-events:auto;">
          <div class="marker marker-${marker.color}" data-year="${year}"></div>
          <div class="marker-label">${marker.name}</div>
        </div>
      `);
      container.append($wrapper);
    });
  });

  updateVisibility();
}

function updateVisibility(changedYear = null) {
  const soloMode = $("#solo-mode").is(":checked");

  if (soloMode && changedYear) {
    $("#sidebar input[data-year]").prop("checked", false);
    $(`#sidebar input[data-year="${changedYear}"]`).prop("checked", true);
  }

  const activeYears = $("#sidebar input[data-year]:checked")
    .map((_, el) => el.dataset.year)
    .get();

  $(".marker-wrapper").each(function () {
    if (activeYears.includes(this.dataset.year)) {
      this.style.opacity = "1";
      this.style.pointerEvents = "auto"; // enable hover/focus
    } else {
      this.style.opacity = "0";
      this.style.pointerEvents = "none"; // disable hover/focus
    }
  });
}

// Event bindings
$(document).on("change", "#sidebar input[data-year]", function () {
  updateVisibility(this.dataset.year);
});

$(document).on("change", "#solo-mode", function () {
  updateVisibility();
});

// Initialize markers on page load
$(document).ready(renderMarkers);
</script>
</body>
</html>
